[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codemesa"
version = "0.1.0"
description = "Multi-agent AI coding assistant that builds complete projects from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kamalesh"}]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2"]
ollama = ["ollama"]
dev = ["pytest>=7.0", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
